name: 语忆AI Windows 构建
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装测试依赖
        run: python -m pip install -r requirements.txt
      - name: 虚构导入资料测试
        run: python -X utf8 -m unittest test_import_persona test_qq_settings test_qq_context test_qq_runtime test_qq_supervisor test_qq_console
      - name: 本地服务回归测试
        run: node --test upstream-v1.2.0/console/*.test.mjs upstream-v1.2.0/src/qq-*.test.mjs upstream-v1.2.0/src/companion-reply.test.mjs
      - name: 构建 语忆AI
        shell: powershell
        run: ./packaging/build-portable.ps1 -SourceRoot . -OutputRoot dist
      - name: 验证桌面启动与安装升级
        env:
          YUYI_TEST_WEBVIEW_RUNTIME: ${{ github.workspace }}/dist/YuYiAI/runtime/webview2
        run: python packaging/test_packaging.py
      - name: 完整安装包验收
        shell: pwsh
        run: |
          $installed = Join-Path $env:RUNNER_TEMP 'YuYiAI-install-verified'
          $setup = (Resolve-Path 'dist/语忆AI-Setup.exe').Path
          $result = Start-Process -FilePath $setup -ArgumentList @('/quiet', '/target', ('"{0}"' -f $installed), '/no-launch', '/no-shortcut') -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw '完整安装失败，请检查安装日志。' }
          $env:YUYI_REVIEW_MANIFEST = (Resolve-Path 'PUBLIC-SOURCE-MANIFEST.json').Path
          Set-Location -LiteralPath $installed
          $verify = @'
          from pathlib import Path
          import hashlib,json,os,subprocess
          import PIL,numpy,jieba,qrcode,settings,runtime_paths
          root=Path.cwd()
          manifest=json.loads(Path(os.environ['YUYI_REVIEW_MANIFEST']).read_text(encoding='utf-8'))['files']
          for name,digest in manifest.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          assert not settings.load_config()['enabled']
          assert not settings.KEYFILE.exists()
          import qq_settings,qq_runtime
          assert not qq_settings.load_config()['enabled']
          assert qq_settings.load_config()['privateUsers']==[]
          assert qq_settings.load_config()['groups']==[]
          assert not qq_runtime.status()['installed']
          assert not (root/'private').exists()
          assert not (root/'data/ilink-auth.dpapi').exists()
          assert {p.name for p in (root/'upstream-v1.2.0/personas').glob('*.md')}=={'linmuwan.md','dafeiyu.md'}
          gallery=json.loads((root/'data/media-catalog-linmuwan.json').read_text(encoding='utf-8'))
          assert gallery['builtin'] and len(gallery['items'])==319
          assert all((root/'upstream-v1.2.0'/item['uri']).is_file() for item in gallery['items'])
          assert (root/'语忆AI.exe').is_file()
          subprocess.run([runtime_paths.node_executable(),'--version'],check=True)
          print('Complete installer: source hashes, bundled imports and clean default state verified.')
          '@
          & (Join-Path $installed 'runtime/python/python.exe') -B -c $verify
          if ($LASTEXITCODE -ne 0) { throw '完整安装内容核验失败。' }
      - uses: actions/upload-artifact@v4
        with:
          name: YuYiAI-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
